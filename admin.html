<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>Album Manager · MS Photography</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=20260728-watermark" />
  <style>.watermark-settings{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.watermark-settings select{padding:8px;border:1px solid var(--line);border-radius:8px;background:#fff}.watermark-toggle{border:0;border-radius:999px;padding:9px 13px;font:inherit;font-weight:700;cursor:pointer;background:#ece8e1}.watermark-toggle.active{background:#161616;color:#fff}.admin-album-row{grid-template-columns:72px minmax(180px,1fr) auto auto}@media(max-width:800px){.admin-album-row{grid-template-columns:64px 1fr}.admin-album-row .watermark-settings,.admin-album-row .danger-text{grid-column:2}}</style>
</head>
<body class="admin-body">
  <header class="site-header solid"><a class="brand" href="index.html">MS <span>Photography</span></a><nav><a href="index.html">View website</a></nav></header>
  <main class="admin-main">
    <section id="login-panel" class="admin-card narrow"><p class="eyebrow">Secure access</p><h1>Album Manager</h1><p>Sign in with your administrator email and password.</p><form id="login-form" class="form-stack"><label>Email<input id="email" type="email" required autocomplete="email"></label><label>Password<input id="password" type="password" required autocomplete="current-password"></label><button class="button button-dark" type="submit">Sign in</button></form><p id="login-message" class="form-message"></p></section>
    <section id="manager-panel" class="hidden">
      <div class="admin-toolbar"><div><p class="eyebrow">Dashboard</p><h1>Manage albums</h1></div><div><button id="purge-expired" class="text-button" type="button">Purge expired galleries</button><button id="logout-button" class="text-button">Sign out</button></div></div>
      <div class="admin-layout">
        <section class="admin-card"><h2>Create an album</h2><form id="album-form" class="form-stack"><label>Album title<input id="album-title" required maxlength="100" placeholder="Family day out"></label><label>Event date<input id="album-date" type="date"></label><label>Gallery expiry<input id="album-expiry" type="date"></label><label>Description<textarea id="album-description" rows="3" maxlength="500" placeholder="A short description"></textarea></label><label class="checkbox"><input id="album-public" type="checkbox" checked> Publish album publicly</label><label class="checkbox"><input id="album-watermark" type="checkbox"> Show a watermark on this album</label><label>Watermark style<select id="album-watermark-type"><option value="proof">PROOF text</option><option value="logo">MS logo</option></select></label><button class="button button-dark" type="submit">Create album</button></form></section>
        <section class="admin-card"><h2>Bulk photo upload</h2><form id="upload-form" class="form-stack"><label>Choose album<select id="album-select" required><option value="">Select an album</option></select></label><label class="drop-zone" id="drop-zone"><input id="photo-files" type="file" accept="image/jpeg,image/png,image/webp" multiple hidden><strong>Tap to choose photos</strong><span>or drag and drop hundreds at once</span><small>JPEG, PNG or WebP</small></label><div id="file-summary" class="file-summary">No photos selected</div><button class="button button-dark" type="submit">Upload selected photos</button></form><div id="upload-status" class="upload-status hidden"><div class="progress-track"><div id="progress-bar" class="progress-bar"></div></div><p id="progress-text"></p></div></section>
      </div>
      <section class="admin-card album-list-card"><div class="section-heading compact"><div><p class="eyebrow">Library</p><h2>Your albums</h2></div></div><div id="admin-album-list" class="admin-album-list"></div></section>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js?v=20260728-watermark"></script><script src="admin.js?v=20260728-watermark"></script><script src="expiry-admin.js?v=20260728-watermark"></script>
</body>
</html>
